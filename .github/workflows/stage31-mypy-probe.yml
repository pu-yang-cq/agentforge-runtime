name: Stage 3.1 mypy Probe

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_MYPY_PROBE

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Reconstruct exact RC2 and apply package-boundary candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/agentforge-mypy-probe
          mkdir -p /tmp/agentforge-mypy-probe
          cat rc/rc2.part*.b64 | base64 -d > /tmp/agentforge-rc2.tar.gz
          echo "81a5efecdd1e9a7f23918ce444b9e4fe74a03f984192961f337b4fe6ea4ed6ce  /tmp/agentforge-rc2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agentforge-rc2.tar.gz -C /tmp/agentforge-mypy-probe
          cp uv.lock /tmp/agentforge-mypy-probe/uv.lock
          touch /tmp/agentforge-mypy-probe/apps/__init__.py
          touch /tmp/agentforge-mypy-probe/apps/api/__init__.py
          touch /tmp/agentforge-mypy-probe/apps/worker/__init__.py

      - name: Run exact target mypy
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -v /tmp/agentforge-mypy-probe:/workspace -w /workspace ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim sh -lc "set -eu; export UV_CACHE_DIR=/tmp/uv-cache; uv sync --locked --all-groups; uv run --locked mypy --cache-dir /tmp/mypy-cache" 2>&1 | tee /tmp/stage31-mypy-probe.txt || true

      - name: Upload mypy probe
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stage31-mypy-probe
          path: /tmp/stage31-mypy-probe.txt
          if-no-files-found: error
          retention-days: 2
