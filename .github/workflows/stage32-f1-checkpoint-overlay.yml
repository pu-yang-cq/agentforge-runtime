name: Stage 3.2-F1 Checkpoint Overlay

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_F1

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Apply Stage 3.2-F1 implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/stage32_f1_patch.py

      - name: Canonically format Stage 3.2-F1 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-f1-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-f1-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff format src migrations tests"

      - name: Verify checkpoint authority surface
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docs/implementation/stage3.2-e-accepted.md
          test -f docs/implementation/stage3.2-f-slices-frozen.md
          test -f migrations/versions/0016_checkpoint_overlay.py
          grep -R 'class RuntimeCheckpoint' -n src
          grep -R 'load_checkpoint_overlay' -n src tests
          grep -R 'validate_checkpoint_private_payload' -n src tests
          grep -R 'event_high_water' -n src migrations tests
          grep -R 'run_state_version' -n src migrations tests

      - name: Prove durable facts outrank checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/infrastructure/db/runtime_store.py").read_text()
          tree = ast.parse(source)
          fn = next(
              n for n in ast.walk(tree)
              if isinstance(n, ast.AsyncFunctionDef) and n.name == "load_checkpoint_overlay"
          )
          text = ast.get_source_segment(source, fn) or ""
          required = [
              "checkpoint.run_state_version == state.state_version",
              "checkpoint.message_high_water == counter.message_sequence",
              "checkpoint.event_high_water == counter.event_sequence",
              "checkpoint.schema_version == supported_schema_version",
              "checkpoint.runner_version == runner_version.strip()",
              "checkpoint.execution_spec_identity == current_spec",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing checkpoint precedence invariant: {token}")
          print("durable facts > checkpoint compatibility/freshness: PASS")
          PY

      - name: Prove checkpoint cannot carry business authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path("src/agentforge/domain/checkpoints.py").read_text()
          required = [
              '"chain_of_thought"',
              '"resolved_credentials"',
              '"cancel_requested"',
              '"action_outcome"',
              '"tool_call_outcome"',
          ]
          for token in required:
              if token not in source:
                  raise SystemExit(f"missing forbidden checkpoint key: {token}")
          print("checkpoint authority/secret exclusion: PASS")
          PY

      - name: Run Stage 3.2-F1 target gate
        shell: bash
        run: |
          set +e
          ./scripts/validate_stage31_containerized.sh > f1-target-gate.log 2>&1
          rc=$?
          cat f1-target-gate.log
          exit $rc

      - name: Upload F1 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage32-f1-target-gate-diagnostics
          path: f1-target-gate.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit Stage 3.2-F1 only if green
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git rm scripts/stage32_f1_patch.py
          git add src migrations tests
          git diff --cached --check
          git commit -m "feat(runtime): add optional Checkpoint V1 overlay"
          git push origin HEAD:main
