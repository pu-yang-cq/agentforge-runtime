name: Stage 3.2-B2 Side-effect Preparation

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_B2

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Apply Stage 3.2-B2 implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/stage32_b2_patch.py

      - name: Canonically format Stage 3.2-B2 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-b2-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-b2-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff format src migrations tests"

      - name: Verify B2 semantic boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -R 'record_model_side_effect_prepared' -n src tests
          grep -R 'ACTION_PREPARED' -n src tests
          grep -R 'stage32_side_effect_executable' -n src tests
          test -f migrations/versions/0010_side_effect_preparation.py

      - name: Run Stage 3.2-B2 target gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh

      - name: Commit Stage 3.2-B2 only if green
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git rm scripts/stage32_b2_patch.py
          git add src migrations tests
          git diff --cached --check
          git commit -m "feat(runtime): add fenced side-effect preparation transaction"
          git push origin HEAD:main
