name: Stage 3.1 Lock Promotion

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rc/LOCK_REVIEW_APPROVED

permissions:
  contents: write

jobs:
  promote-lock:
    name: Commit reviewed uv.lock
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout acceptance envelope
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Reconstruct and verify RC1 source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/agentforge-rc1
          mkdir -p /tmp/agentforge-rc1
          cat rc/rc1.part*.b64 | base64 -d > /tmp/agentforge-rc1.tar.gz
          echo "20a19cd990dbf121cecc308e446d322432ab41ad85d2255f57695e3f2cb5f05d  /tmp/agentforge-rc1.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agentforge-rc1.tar.gz -C /tmp/agentforge-rc1
          test ! -f /tmp/agentforge-rc1/uv.lock

      - name: Regenerate reviewed lockfile
        shell: bash
        run: |
          cd /tmp/agentforge-rc1
          ./scripts/bootstrap_stage31_lock_containerized.sh

      - name: Verify approved lockfile digest
        shell: bash
        run: |
          echo "ea589824df68c1412a9ba797f673cf4110e122540a06e02ffcf15bb3e4fa406a  /tmp/agentforge-rc1/uv.lock" | sha256sum -c -

      - name: Commit reviewed lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          cp /tmp/agentforge-rc1/uv.lock ./uv.lock
          git config user.name "agentforge-stage31-bot"
          git config user.email "agentforge-stage31-bot@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "build: commit reviewed Stage 3.1 uv.lock"
          git push origin HEAD:main
