name: Stage 3.2 Bootstrap Diagnostic

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_BOOTSTRAP_DIAGNOSTIC

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Reconstruct accepted Stage 3.1 RC4 and inspect tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/agentforge-stage32-base
          mkdir -p /tmp/agentforge-stage32-base
          cat rc/rc4.part*.b64 | base64 -d > /tmp/agentforge-rc4.tar.gz
          echo "696a889a86fc35ea127f6fde803818269427df978d2268345ea614af56d847b7  /tmp/agentforge-rc4.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agentforge-rc4.tar.gz -C /tmp/agentforge-stage32-base
          echo '===== TOP LEVEL ====='
          find /tmp/agentforge-stage32-base -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          echo '===== SOURCE TREE ====='
          find /tmp/agentforge-stage32-base/src -maxdepth 4 -type f | sed 's#^/tmp/agentforge-stage32-base/##' | sort
          echo '===== APPS ====='
          find /tmp/agentforge-stage32-base/apps -maxdepth 3 -type f | sed 's#^/tmp/agentforge-stage32-base/##' | sort
          echo '===== MIGRATIONS ====='
          find /tmp/agentforge-stage32-base/migrations -maxdepth 3 -type f | sed 's#^/tmp/agentforge-stage32-base/##' | sort
          echo '===== TESTS ====='
          find /tmp/agentforge-stage32-base/tests -maxdepth 3 -type f | sed 's#^/tmp/agentforge-stage32-base/##' | sort
          echo '===== PROJECT FILES ====='
          for f in pyproject.toml alembic.ini docker-compose.yml compose.yml Dockerfile .gitignore; do
            test -e "/tmp/agentforge-stage32-base/$f" && echo "$f"
          done
