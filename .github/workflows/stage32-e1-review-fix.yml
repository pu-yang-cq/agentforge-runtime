name: Stage 3.2-E1 Review Fix

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_E1_REVIEW_FIX

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Apply E1 review fix
        run: |
          set -Eeuo pipefail
          python scripts/stage32_e1_review_fix.py

      - name: Format candidate
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-e1fix-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-e1fix-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff format src tests"

      - name: Prove denied model consequence discards on cancellation
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path("src/agentforge/application/run_manager.py").read_text()
          start = source.index("record_model_tool_denied_and_fail_run")
          end = source.index("if isinstance(prepared, PreparedExternalAction)", start)
          region = source[start:end]
          for token in [
              'blocked.code == "CANCEL_REQUESTED"',
              "run.status = RunStatus.RUNNING",
              "record_model_result_discarded_and_cancel_run",
              "return None",
          ]:
              if token not in region:
                  raise SystemExit(f"missing denied/cancel race fix: {token}")
          print("permission-denied model consequence obeys cancellation: PASS")
          PY

      - name: Run full E1 regression
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh

      - name: Commit only if green
        run: |
          set -Eeuo pipefail
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git rm scripts/stage32_e1_review_fix.py
          git add src
          git diff --cached --check
          git commit -m "fix(runtime): honor cancellation on denied model consequence"
          git push origin HEAD:main
