name: Stage 3.2-E1 Cancellation

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_E1

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Apply Stage 3.2-E1 implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/stage32_e1_patch.py

      - name: Canonically format Stage 3.2-E1 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-e1-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-e1-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff format src migrations tests"

      - name: Verify E1 cancellation surface
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docs/implementation/stage3.2-d-accepted.md
          test -f migrations/versions/0014_cancellation_intent.py
          grep -R 'cancel_requested' -n src/agentforge migrations tests
          grep -R 'RUN_CANCEL_REQUESTED' -n src/agentforge
          grep -R 'RUN_CANCELLED' -n src/agentforge
          grep -R 'cancel_run' -n src/agentforge
          grep -R 'CANCEL_REQUESTED' -n src/agentforge

      - name: Prove cancellation shares Run serialization point
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/infrastructure/db/runtime_store.py").read_text()
          tree = ast.parse(source)
          fn = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef) and node.name == "cancel_run"
          )
          text = ast.get_source_segment(source, fn) or ""
          required = [
              "select(RunRow)",
              "with_for_update()",
              "cancel_requested = True",
              "ExternalActionStatus.READY",
              "ToolCallStatus.NOT_EXECUTED",
              "RunStatus.CANCELLED",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing cancel serialization invariant: {token}")
          print("cancel transaction serialized by Run lock: PASS")
          PY

      - name: Prove cancellation is not rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/infrastructure/db/runtime_store.py").read_text()
          tree = ast.parse(source)
          fn = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef) and node.name == "cancel_run"
          )
          text = ast.get_source_segment(source, fn) or ""
          if "ExternalActionStatus.EXECUTING" in text and "ExternalActionStatus.ABORTED" in text:
              # ABORTED is legal for READY only; make sure there is no direct
              # EXECUTING -> ABORTED branch in cancel_run.
              bad = "action.status is ExternalActionStatus.EXECUTING"
              if bad in text:
                  raise SystemExit("cancel_run attempts to rollback EXECUTING action")
          if "ToolExecutionAttemptStatus.STARTED" not in text:
              raise SystemExit("cancel transaction does not inspect authorized in-flight work")
          print("cancellation does not rollback authorized side effects: PASS")
          PY

      - name: Prove business starts are cancellation-fenced but reconciliation remains safety work
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          recorder = Path("src/agentforge/infrastructure/db/execution_recorder.py").read_text()
          for name in [
              "begin_model_invocation",
              "record_model_tool_started",
              "record_model_side_effect_prepared",
              "record_side_effect_attempt_started",
              "record_recovered_read_started",
          ]:
              start = recorder.index(f"async def {name}")
              try:
                  end = recorder.index("\n    async def ", start + 10)
              except ValueError:
                  end = len(recorder)
              body = recorder[start:end]
              if "_assert_business_progression_allowed" not in body:
                  raise SystemExit(f"cancel fence missing from {name}")

          recon_start = recorder.index("async def record_reconciliation_started")
          recon_end = recorder.index("\n    async def ", recon_start + 10)
          recon = recorder[recon_start:recon_end]
          if "_assert_business_progression_allowed" in recon:
              raise SystemExit("cancellation must not block bounded safety reconciliation")
          print("business work fenced; safety reconciliation exempt: PASS")
          PY

      - name: Verify explicit E1 regression cases
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -R 'test_cancel_queued_run_terminalizes_without_business_work' -n tests
          grep -R 'test_cancel_ready_side_effect_aborts_before_action_commit' -n tests
          grep -R 'test_cancel_requested_fences_new_model_business_progression' -n tests
          grep -R 'test_cancel_run_api_contract' -n tests

      - name: Run Stage 3.2-E1 target gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh

      - name: Commit Stage 3.2-E1 only if green
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git rm scripts/stage32_e1_patch.py
          git add src migrations tests
          git diff --cached --check
          git commit -m "feat(runtime): add durable cancellation intent"
          git push origin HEAD:main
