name: Stage 3.2-F Aggregate Acceptance

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_F_ACCEPTANCE

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify frozen F lineage and committed F3 surface
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docs/implementation/stage3.2-f-slices-frozen.md
          test -f docs/implementation/stage3.2-f1-checkpoint-overlay.md
          test -f docs/implementation/stage3.2-f2-fake-external-ledger.md
          test -f docs/acceptance/stage3.2-f3-recovery-matrix.json
          test -f tests/unit/test_stage32_f3_recovery_matrix.py
          test -f src/agentforge/testing/fake_external_system.py
          test ! -f scripts/stage32_f3_patch.py
          grep -R 'test_f3_crash_post_commit_pre_call_no_duplicate_effect' -n tests/integration
          grep -R 'test_f3_crash_during_external_call_recovers_without_duplicate_effect' -n tests/integration
          grep -R 'test_f3_crash_after_external_effect_before_response_reconciles_without_replay' -n tests/integration
          grep -R 'test_f3_crash_after_response_before_result_commit_reconciles_without_replay' -n tests/integration

      - name: Prove exact executable 12-window coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python - <<'PY'
          import ast
          import json
          from pathlib import Path
          from agentforge.testing.fake_external_system import CrashBarrierPoint

          matrix=json.loads(Path("docs/acceptance/stage3.2-f3-recovery-matrix.json").read_text())
          windows=matrix["windows"]
          expected={p.value for p in CrashBarrierPoint}
          actual={item["barrier"] for item in windows}
          if len(windows) != 12 or actual != expected:
              raise SystemExit(f"recovery matrix mismatch: count={len(windows)} missing={expected-actual} extra={actual-expected}")
          if [item["id"] for item in windows] != list(range(1,13)):
              raise SystemExit("recovery matrix IDs must be exactly 1..12")

          parsed={}
          for item in windows:
              if not item.get("safety") or not item.get("pytest_nodes"):
                  raise SystemExit(f"window lacks executable evidence: {item}")
              for node in item["pytest_nodes"]:
                  path_s, fn_name=node.split("::",1)
                  path=Path(path_s)
                  if not path.exists():
                      raise SystemExit(f"missing matrix test file: {path_s}")
                  tree=parsed.setdefault(path_s, ast.parse(path.read_text()))
                  names={
                      n.name for n in ast.walk(tree)
                      if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))
                  }
                  if fn_name not in names:
                      raise SystemExit(f"missing matrix test node: {node}")
          print("exact executable 12-window recovery matrix: PASS")
          PY

      - name: Prove testing infrastructure cannot become runtime authority
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -R 'agentforge.testing' -n src/agentforge --exclude-dir=testing; then
            echo "production runtime imports test-only crash infrastructure" >&2
            exit 1
          fi
          grep -R 'CHECKPOINT_SCHEMA_VERSION' -n src/agentforge
          grep -R 'load_checkpoint_overlay' -n src/agentforge
          grep -R 'load_reconciliation_external_action' -n src/agentforge
          grep -R 'cancel_requested' -n src/agentforge
          echo "test-only infrastructure remains non-authoritative: PASS"

      - name: Prove recovery precedence over fresh model reasoning
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python - <<'PY'
          import ast
          from pathlib import Path

          source=Path("src/agentforge/application/run_manager.py").read_text()
          tree=ast.parse(source)
          execute=next(
              n for n in ast.walk(tree)
              if isinstance(n,ast.AsyncFunctionDef) and n.name=="execute"
          )
          calls=[]
          for n in ast.walk(execute):
              if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute):
                  calls.append((n.lineno,n.func.attr))
          recon=min(line for line,name in calls if name=="load_reconciliation_external_action")
          ready=min(line for line,name in calls if name=="load_ready_external_action")
          read=min(line for line,name in calls if name=="load_recoverable_read_call")
          model=min(line for line,name in calls if name=="begin_model_invocation")
          if not recon < ready < read < model:
              raise SystemExit(
                  f"recovery precedence violated: reconciliation={recon}, ready={ready}, read={read}, model={model}"
              )
          print("durable recovery facts dominate fresh model reasoning: PASS")
          PY

      - name: Run F1 checkpoint authority regression
        shell: bash
        run: |
          set -Eeuo pipefail
          compose='docker compose -f docker-compose.acceptance.yml'
          trap '$compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          $compose up -d postgres
          $compose run --rm validator /bin/sh -lc '
            uv sync --locked --all-groups >/dev/null &&
            uv run --locked pytest -q \
              tests/integration/test_postgres_runtime.py::test_f1_checkpoint_missing_compatible_and_unsupported_fallback \
              tests/integration/test_postgres_runtime.py::test_f1_checkpoint_rejects_authority_secret_and_reasoning_payloads \
              tests/integration/test_postgres_runtime.py::test_f1_newer_tool_action_attempt_and_reconciliation_facts_stale_checkpoint \
              tests/integration/test_postgres_runtime.py::test_f1_newer_cancellation_fact_stales_checkpoint
          '
          $compose down -v --remove-orphans
          trap - EXIT

      - name: Run F2 observable external-ledger regression
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-f-aggregate-f2-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-f-aggregate-f2-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked pytest -q tests/unit/test_fake_external_system.py tests/unit/test_stage32_f3_recovery_matrix.py"

      - name: Run independent 12-window PostgreSQL matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          compose='docker compose -f docker-compose.acceptance.yml'
          trap '$compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          $compose up -d postgres
          $compose run --rm validator /bin/sh -lc '
            uv sync --locked --all-groups >/dev/null &&
            uv run --locked pytest -q \
              tests/integration/test_postgres_runtime.py::test_side_effect_preparation_stale_lease_creates_no_intent \
              tests/integration/test_postgres_runtime.py::test_ready_action_recovery_uses_same_operation_id_without_model_reproposal \
              tests/integration/test_postgres_runtime.py::test_action_commit_deadline_block_aborts_ready_action_without_external_call \
              tests/integration/test_postgres_runtime.py::test_f3_crash_post_commit_pre_call_no_duplicate_effect \
              tests/integration/test_postgres_runtime.py::test_f3_crash_during_external_call_recovers_without_duplicate_effect \
              tests/integration/test_postgres_runtime.py::test_f3_crash_after_external_effect_before_response_reconciles_without_replay \
              tests/integration/test_postgres_runtime.py::test_f3_crash_after_response_before_result_commit_reconciles_without_replay \
              tests/integration/test_postgres_runtime.py::test_e3_result_wins_then_cancellation_does_not_rollback_succeeded_action \
              tests/integration/test_postgres_runtime.py::test_orphaned_reconciliation_attempt_closes_failed_and_preserves_truth \
              tests/integration/test_postgres_runtime.py::test_e3_cancellation_wins_reconciliation_success_truth_without_continuation \
              tests/integration/test_postgres_runtime.py::test_side_effect_safe_retry_reuses_action_and_operation_id_across_claims \
              tests/integration/test_postgres_runtime.py::test_e3_cancel_wins_side_effect_result_records_truth_and_fences_worker
          '
          $compose down -v --remove-orphans
          trap - EXIT

      - name: Run independent full Stage 3.2-F regression
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh
