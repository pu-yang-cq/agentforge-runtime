name: Stage 3.2-F3 Recovery Crash Matrix

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_F3

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Apply Stage 3.2-F3 matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/stage32_f3_patch.py

      - name: Canonically format F3 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-f3-format-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-f3-format-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff format tests/integration/test_postgres_runtime.py tests/unit/test_stage32_f3_recovery_matrix.py"

      - name: Verify F3 matrix contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docs/implementation/stage3.2-f2-fake-external-ledger.md
          test -f docs/acceptance/stage3.2-f3-recovery-matrix.json
          grep -R 'test_f3_crash_post_commit_pre_call_no_duplicate_effect' -n tests/integration
          grep -R 'test_f3_crash_during_external_call_recovers_without_duplicate_effect' -n tests/integration
          grep -R 'test_f3_crash_after_external_effect_before_response_reconciles_without_replay' -n tests/integration
          grep -R 'test_f3_crash_after_response_before_result_commit_reconciles_without_replay' -n tests/integration
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("docs/acceptance/stage3.2-f3-recovery-matrix.json").read_text())
          if [item["id"] for item in data["windows"]] != list(range(1,13)):
              raise SystemExit("F3 matrix must contain crash windows 1..12 exactly")
          if any(not item["pytest_nodes"] for item in data["windows"]):
              raise SystemExit("each crash window must bind executable pytest evidence")
          print("12-window executable matrix: PASS")
          PY

      - name: Run F3 matrix contract tests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-f3-unit-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-f3-unit-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked pytest -q tests/unit/test_stage32_f3_recovery_matrix.py tests/unit/test_fake_external_system.py"

      - name: Run focused 12-window PostgreSQL recovery matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          compose='docker compose -f docker-compose.acceptance.yml'
          trap '$compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          $compose up -d postgres
          $compose run --rm validator /bin/sh -lc '
            uv sync --locked --all-groups >/dev/null &&
            uv run --locked pytest -q \
              tests/integration/test_postgres_runtime.py::test_side_effect_preparation_stale_lease_creates_no_intent \
              tests/integration/test_postgres_runtime.py::test_ready_action_recovery_uses_same_operation_id_without_model_reproposal \
              tests/integration/test_postgres_runtime.py::test_action_commit_deadline_block_aborts_ready_action_without_external_call \
              tests/integration/test_postgres_runtime.py::test_f3_crash_post_commit_pre_call_no_duplicate_effect \
              tests/integration/test_postgres_runtime.py::test_f3_crash_during_external_call_recovers_without_duplicate_effect \
              tests/integration/test_postgres_runtime.py::test_f3_crash_after_external_effect_before_response_reconciles_without_replay \
              tests/integration/test_postgres_runtime.py::test_f3_crash_after_response_before_result_commit_reconciles_without_replay \
              tests/integration/test_postgres_runtime.py::test_e3_result_wins_then_cancellation_does_not_rollback_succeeded_action \
              tests/integration/test_postgres_runtime.py::test_orphaned_reconciliation_attempt_closes_failed_and_preserves_truth \
              tests/integration/test_postgres_runtime.py::test_e3_cancellation_wins_reconciliation_success_truth_without_continuation \
              tests/integration/test_postgres_runtime.py::test_side_effect_safe_retry_reuses_action_and_operation_id_across_claims \
              tests/integration/test_postgres_runtime.py::test_e3_cancel_wins_side_effect_result_records_truth_and_fences_worker
          '
          $compose down -v --remove-orphans
          trap - EXIT

      - name: Run full Stage 3.2-F3 regression
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh

      - name: Commit Stage 3.2-F3 only if green
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git rm scripts/stage32_f3_patch.py
          git add docs/acceptance/stage3.2-f3-recovery-matrix.json tests/unit/test_stage32_f3_recovery_matrix.py tests/integration/test_postgres_runtime.py
          git diff --cached --check
          git commit -m "test(runtime): add full Stage 3.2 recovery crash matrix"
          git push origin HEAD:main
