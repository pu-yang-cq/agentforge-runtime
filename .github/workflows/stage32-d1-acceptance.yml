name: Stage 3.2-D1 Acceptance

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_D1_ACCEPTANCE

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify committed D1 surface
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docs/implementation/stage3.2-c-accepted.md
          test -f docs/implementation/stage3.2-d-slices-frozen.md
          test -f migrations/versions/0011_side_effect_unknown.py
          test ! -f scripts/stage32_d1_patch.py
          grep -R 'UNRESOLVED' -n src/agentforge
          grep -R 'record_side_effect_unknown' -n src/agentforge
          grep -R 'load_unknown_external_action' -n src/agentforge
          grep -R 'ACTION_UNKNOWN' -n src/agentforge

      - name: Prove UNKNOWN dominance over new reasoning
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/application/run_manager.py").read_text()
          tree = ast.parse(source)
          execute = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef) and node.name == "execute"
          )
          calls = [
              (node.lineno, node.func.attr)
              for node in ast.walk(execute)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute)
          ]
          unknown = min(line for line, name in calls if name == "load_unknown_external_action")
          model = min(line for line, name in calls if name == "begin_model_invocation")
          if unknown >= model:
              raise SystemExit("UNKNOWN check does not dominate model progression")
          print("UNKNOWN > new reasoning authority: PASS")
          PY

      - name: Prove side-effect ambiguity has no blind retry edge
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/application/run_manager.py").read_text()
          tree = ast.parse(source)
          helper = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef)
              and node.name == "_execute_side_effect_action"
          )
          text = ast.get_source_segment(source, helper) or ""
          required = [
              "record_side_effect_unknown",
              "SIDE_EFFECT_POSSIBLE_EXECUTION",
              "SIDE_EFFECT_UNCLASSIFIED_EXCEPTION_AFTER_COMMIT",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing D1 ambiguity guard: {token}")
          forbidden = [
              "record_read_transient_failure",
              "retry_after_failure",
              "record_run_yielded",
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"blind retry edge found in side-effect result helper: {token}")
          print("No blind retry from ambiguous side-effect truth: PASS")
          PY

      - name: Verify D1 regression tests are explicit
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -R 'test_side_effect_possible_execution_becomes_unknown_and_stops_reasoning' -n tests
          grep -R 'test_unclassified_side_effect_exception_is_conservatively_unknown' -n tests
          grep -R 'test_definite_not_executed_side_effect_failure_is_not_unknown' -n tests
          grep -R 'test_side_effect_ambiguous_result_persists_unknown_without_new_reasoning' -n tests
          grep -R 'test_side_effect_definite_nonexecution_persists_failed_truth' -n tests

      - name: Run independent D1 acceptance gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh
