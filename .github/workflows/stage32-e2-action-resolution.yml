name: Stage 3.2-E2 Action Resolution

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_E2

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Apply Stage 3.2-E2 implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/stage32_e2_patch.py

      - name: Canonically format E2 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-e2-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-e2-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff check --fix src migrations tests && uv run --locked ruff format src migrations tests"

      - name: Verify E2 durable surface
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docs/implementation/stage3.2-e1-cancellation.md
          test -f migrations/versions/0015_action_resolution.py
          grep -R 'class ActionResolutionOutcome' -n src/agentforge
          grep -R 'class ActionResolutionRow' -n src/agentforge
          grep -R 'async def resolve_action' -n src/agentforge
          grep -R 'ACTION_RESOLUTION_RECORDED' -n src/agentforge
          grep -R 'QueueReason.ACTION_RESOLVED' -n src/agentforge

      - name: Prove manual resolution lock order and state guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/infrastructure/db/runtime_store.py").read_text()
          tree = ast.parse(source)
          fn = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef) and node.name == "resolve_action"
          )
          body = ast.get_source_segment(source, fn) or ""
          run_pos = body.find("select(RunRow)")
          action_pos = body.find("select(ExternalActionRow)")
          call_pos = body.find("select(ToolCallRow)")
          if min(run_pos, action_pos, call_pos) < 0 or not run_pos < action_pos < call_pos:
              raise SystemExit(
                  f"manual resolution lock order invalid: Run={run_pos}, Action={action_pos}, Call={call_pos}"
              )
          required = [
              "ExternalActionStatus.MANUAL_REVIEW",
              "ToolCallStatus.UNRESOLVED",
              "RunStatus.WAITING_ACTION_RESOLUTION",
              "RunStatus.CANCELLED",
          ]
          for token in required:
              if token not in body:
                  raise SystemExit(f"manual resolution state guard missing: {token}")
          print("Run -> ExternalAction -> ToolCall resolution lock/state guard: PASS")
          PY

      - name: Prove cancelled resolution cannot reopen Run
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/infrastructure/db/runtime_store.py").read_text()
          tree = ast.parse(source)
          fn = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef) and node.name == "resolve_action"
          )
          body = ast.get_source_segment(source, fn) or ""
          cancelled = body.find("if run_row.status is RunStatus.CANCELLED")
          queued = body.find("run_row.status = RunStatus.QUEUED")
          if cancelled < 0 or queued < 0 or cancelled >= queued:
              raise SystemExit("CANCELLED fact-only branch must precede any ACTION_RESOLVED queue")
          if "Post-terminal resolution updates facts only" not in body:
              raise SystemExit("cancelled fact-only resolution branch missing")
          print("CANCELLED + MANUAL_REVIEW resolution cannot reopen Run: PASS")
          PY

      - name: Prove one final ActionResolution
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -n 'uq_action_resolutions_external_action' migrations/versions/0015_action_resolution.py
          python - <<'PY'
          from pathlib import Path
          source = Path("src/agentforge/infrastructure/db/runtime_store.py").read_text()
          start = source.index("async def resolve_action")
          end = source.index("\n    async def claim_next_run", start)
          body = source[start:end]
          required = [
              "existing is not None",
              "same_request",
              "contradictory final resolution",
          ]
          for token in required:
              if token not in body:
                  raise SystemExit(f"resolution replay/conflict invariant missing: {token}")
          print("one final resolution + idempotent exact replay: PASS")
          PY

      - name: Run Stage 3.2-E2 target gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh

      - name: Commit Stage 3.2-E2 only if green
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git rm scripts/stage32_e2_patch.py
          git add src migrations tests
          git diff --cached --check
          git commit -m "feat(runtime): add durable manual action resolution"
          git push origin HEAD:main
