name: Stage 3.2-D3 Canonical Diagnostic

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_D3_CANONICAL_DIAG

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: stage32-d3-canonical-debug
          persist-credentials: true

      - name: Apply latest D3 patcher from main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout origin/main -- scripts/stage32_d3_patch.py
          python scripts/stage32_d3_patch.py

      - name: Capture exact canonical command
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-d3-canonical-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-d3-canonical-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff check --fix src migrations tests && uv run --locked ruff format src migrations tests" \
            > /tmp/canonical.log 2>&1
          code=$?
          set -e
          git reset --hard HEAD
          mkdir -p diagnostics
          {
            echo "exit_code=$code"
            cat /tmp/canonical.log
          } > diagnostics/stage32-d3-canonical.log
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git add diagnostics/stage32-d3-canonical.log
          git commit -m "debug: capture Stage 3.2-D3 canonical output"
          git push origin HEAD:stage32-d3-canonical-debug
