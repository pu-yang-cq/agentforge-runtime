name: Stage 3.2-A2 Candidate Gate

"on":
  push:
    branches: [stage32-a2-candidate]
    paths:
      - rc/RUN_STAGE32_A2_CANDIDATE

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Canonically format candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-a2-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-a2-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff format src migrations tests"

      - name: Run Stage 3.2-A2 target gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh

      - name: Persist canonical formatting if changed
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! git diff --quiet -- src migrations tests; then
            git config user.name "agentforge-stage32-bot"
            git config user.email "agentforge-stage32-bot@users.noreply.github.com"
            git add src migrations tests
            git diff --cached --check
            git commit -m "style: canonicalize Stage 3.2-A2 candidate"
            git push origin HEAD:stage32-a2-candidate
          fi
