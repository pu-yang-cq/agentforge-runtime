name: Stage 3.3-A1 Identity Policy Foundation

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE33_A1_ACCEPTANCE

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify frozen Stage 3.3 lineage and A1 surface
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docs/design/stage3.3-governance-v1.0-frozen.md
          test -f docs/acceptance/stage3.3-governance-acceptance-v1.0-frozen.md
          test -f docs/implementation/stage3.3-slices-frozen.md
          test -f docs/execution/verified-execution-protocol-v1.0.md
          test -f migrations/versions/0017_governance_identity_policy.py
          test -f src/agentforge/domain/governance.py
          test -f src/agentforge/application/principals.py
          test -f src/agentforge/infrastructure/db/governance_store.py
          test -f tests/unit/test_stage33_a1_governance_foundation.py
          test -f tests/integration/test_stage33_a1_postgres.py

      - name: Prove accepted Stage 3.2 migration bytes are unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline=fa747268cfbf1d5b57e5796b9cbc767abc3d4e0c
          for path in migrations/versions/00{01,02,03,04,05,06,07,08,09}_*.py                       migrations/versions/001{0,1,2,3,4,5,6}_*.py; do
            git diff --exit-code "$baseline" -- "$path"
          done
          echo "accepted Stage 3.2 migration lineage unchanged: PASS"

      - name: Run Stage 3.3-A1 unit contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm             -v "$PWD:/workspace"             -w /workspace             -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-stage33-a1-unit-venv             -e UV_CACHE_DIR=/tmp/agentforge-stage33-a1-unit-cache             ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim             sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked pytest -q tests/unit/test_stage33_a1_governance_foundation.py tests/unit/test_migration_contract.py tests/unit/test_alembic_revision_width.py"

      - name: Run Stage 3.3-A1 PostgreSQL contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          compose='docker compose -f docker-compose.acceptance.yml'
          trap '$compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          $compose up -d postgres
          $compose run --rm validator /bin/sh -lc '
            uv sync --locked --all-groups >/dev/null &&
            uv run --locked pytest -q tests/integration/test_stage33_a1_postgres.py
          '
          $compose down -v --remove-orphans
          trap - EXIT

      - name: Run complete Stage 3.2 regression on Stage 3.3 head
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh
