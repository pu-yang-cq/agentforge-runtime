name: Stage 3.2-A Acceptance

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_A_ACCEPTANCE

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify Stage 3.2-A migration envelope
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f migrations/versions/0006_tool_attempts.py
          test -f migrations/versions/0007_run_limits.py
          test -f migrations/versions/0008_read_retry_policy.py
          grep -q 'down_revision: str | None = "0007_run_limits"' migrations/versions/0008_read_retry_policy.py

      - name: Run full Stage 3.2-A target acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh

      - name: Verify Stage 3.2-A semantic surface
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'class ToolExecutionAttempt' src/agentforge/domain/models.py
          grep -q 'max_model_invocations' src/agentforge/domain/models.py
          grep -q 'max_tool_attempts' src/agentforge/domain/models.py
          grep -q 'deadline_at' src/agentforge/domain/models.py
          grep -q 'yield_to_queue' src/agentforge/domain/models.py
          grep -q 'record_read_transient_failure' src/agentforge/application/ports.py
          grep -q 'TOOL_RETRY_SCHEDULED' src/agentforge/domain/enums.py
          grep -q 'RUN_YIELDED' src/agentforge/domain/enums.py
          grep -q 'ToolExecutionAttemptRow' src/agentforge/infrastructure/db/models.py
