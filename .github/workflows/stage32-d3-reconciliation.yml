name: Stage 3.2-D3 Reconciliation

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_D3

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Apply Stage 3.2-D3 implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/stage32_d3_patch.py

      - name: Canonically format D3 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-d3-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-d3-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff check --fix src migrations tests && uv run --locked ruff format src migrations tests"

      - name: Verify D3 durable surface
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f migrations/versions/0013_reconciliation.py
          test -f docs/implementation/stage3.2-d2-safe-retry-orphan.md
          grep -R 'class ReconciliationAttempt' -n src/agentforge
          grep -R 'ReconciliationAttemptRow' -n src/agentforge
          grep -R 'WAITING_ACTION_RESOLUTION' -n src/agentforge migrations
          grep -R 'record_reconciliation_started' -n src tests
          grep -R 'RECONCILIATION_RETRY_SCHEDULED' -n src tests
          grep -R 'reconciliation_max_attempts' -n src migrations tests

      - name: Prove reconciliation commit-before-query boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/application/run_manager.py").read_text()
          tree = ast.parse(source)
          execute = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef) and node.name == "execute"
          )
          calls = [
              (node.lineno, node.func.attr)
              for node in ast.walk(execute)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute)
          ]
          start = min(line for line, name in calls if name == "record_reconciliation_started")
          query = min(line for line, name in calls if name == "execute_reconciliation")
          model = min(line for line, name in calls if name == "begin_model_invocation")
          if not start < query < model:
              raise SystemExit(
                  f"reconciliation must start durably before query and before model: "
                  f"{start}, {query}, {model}"
              )
          print("reconciliation STARTED-before-query-before-model: PASS")
          PY

      - name: Prove reconciliation is a separate safety budget
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/infrastructure/db/execution_recorder.py").read_text()
          tree = ast.parse(source)
          start = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef)
              and node.name == "record_reconciliation_started"
          )
          text = ast.get_source_segment(source, start) or ""
          forbidden = [
              "_assert_tool_budget",
              "_assert_deadline_not_expired",
              "tool_attempts_used +=",
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"reconciliation incorrectly consumes task budget: {token}")
          required = [
              "ReconciliationAttemptRow",
              "max_attempts",
              "ReconciliationAttemptStatus.STARTED",
              "ExternalActionStatus.RECONCILING",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing reconciliation safety budget invariant: {token}")
          print("separate bounded reconciliation budget: PASS")
          PY

      - name: Prove unsafe BEST_EFFORT cannot retry non-idempotent action
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/infrastructure/db/execution_recorder.py").read_text()
          tree = ast.parse(source)
          fn = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef)
              and node.name == "record_reconciliation_result"
          )
          text = ast.get_source_segment(source, fn) or ""
          required = [
              "ReconciliationMode.AUTHORITATIVE",
              "ReconciliationMode.BEST_EFFORT",
              "binding.idempotency_supported",
              "BEST_EFFORT_NOT_EXECUTED_UNSAFE",
              "ExternalActionStatus.MANUAL_REVIEW",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing BEST_EFFORT safety invariant: {token}")
          print("BEST_EFFORT NOT_EXECUTED safety gating: PASS")
          PY

      - name: Prove unresolved action truth blocks direct model start
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -R '_assert_no_unresolved_actions' -n src/agentforge/application/run_manager.py src/agentforge/infrastructure/db/execution_recorder.py

      - name: Run Stage 3.2-D3 target gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh

      - name: Commit Stage 3.2-D3 only if green
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git rm scripts/stage32_d3_patch.py
          git add src migrations tests
          git diff --cached --check
          git commit -m "feat(runtime): add durable reconciliation lifecycle"
          git push origin HEAD:main
