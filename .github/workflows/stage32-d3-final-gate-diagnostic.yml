name: Stage 3.2-D3 Final Gate Diagnostic

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_D3_FINAL_DIAG

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: stage32-d3-final-debug
          persist-credentials: true

      - name: Apply latest D3 patcher and canonicalize
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout origin/main -- scripts/stage32_d3_patch.py
          python scripts/stage32_d3_patch.py
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-d3-final-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-d3-final-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff check --fix src migrations tests && uv run --locked ruff format src migrations tests"

      - name: Run exact full target gate and capture output
        shell: bash
        run: |
          set +e
          ./scripts/validate_stage31_containerized.sh > /tmp/d3-final-gate.log 2>&1
          code=$?
          set -e
          git reset --hard HEAD
          mkdir -p diagnostics
          {
            echo "exit_code=$code"
            cat /tmp/d3-final-gate.log
          } > diagnostics/stage32-d3-final-gate.log
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git add diagnostics/stage32-d3-final-gate.log
          git commit -m "debug: capture latest Stage 3.2-D3 full gate"
          git push origin HEAD:stage32-d3-final-debug
