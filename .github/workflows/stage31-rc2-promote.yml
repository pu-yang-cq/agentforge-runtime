name: Stage 3.1 RC2 Promotion

"on":
  push:
    branches: [main]
    paths:
      - rc/PROMOTE_RC2

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Reconstruct RC1 and apply reviewed Ruff-only repair
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/agentforge-rc2
          mkdir -p /tmp/agentforge-rc2
          cat rc/rc1.part*.b64 | base64 -d > /tmp/agentforge-rc1.tar.gz
          echo "20a19cd990dbf121cecc308e446d322432ab41ad85d2255f57695e3f2cb5f05d  /tmp/agentforge-rc1.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agentforge-rc1.tar.gz -C /tmp/agentforge-rc2
          cp uv.lock /tmp/agentforge-rc2/uv.lock
          docker run --rm -v /tmp/agentforge-rc2:/workspace -w /workspace ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim sh -lc "set -eu; export UV_CACHE_DIR=/tmp/uv-cache; uv sync --locked --all-groups; uv run --locked ruff check --fix --unsafe-fixes . || true; uv run --locked ruff format .; rm -rf .venv .ruff_cache"
          python -c 'from pathlib import Path; p=Path("/tmp/agentforge-rc2/tests/integration/test_postgres_runtime.py"); s=p.read_text(); nl=chr(10); prefix="# ruff: noqa: E402"+nl+nl; p.write_text(s if s.startswith(prefix) else prefix+s)'
          sed -i 's/V1.0-RC1/V1.0-RC2/g' /tmp/agentforge-rc2/README.md
          printf '%s' '' | base64 -d > /tmp/agentforge-rc2/docs/reviews/stage3.1-v1.0-rc2-review.md

      - name: Verify RC2 quality before packaging
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -v /tmp/agentforge-rc2:/workspace -w /workspace ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim sh -lc "set -eu; export UV_CACHE_DIR=/tmp/uv-cache; uv sync --locked --all-groups; uv run --locked ruff check .; uv run --locked ruff format --check .; PYTHONPATH=src uv run --locked pytest -q tests/unit; python -m compileall -q src apps tests; find . -type f -name '*.pyc' -delete; find . -type d -name '__pycache__' -empty -delete; rm -rf .venv .ruff_cache .pytest_cache"

      - name: Build and verify deterministic RC2 source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f /tmp/agentforge-rc2/uv.lock
          find /tmp/agentforge-rc2 -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache -o -name .venv \) -prune -exec rm -rf {} +
          find /tmp/agentforge-rc2 -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          (cd /tmp/agentforge-rc2 && tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' --exclude='./uv.lock' --exclude='./.pytest_cache' --exclude='./.mypy_cache' --exclude='./.ruff_cache' --exclude='./.venv' --exclude='*/__pycache__/*' --exclude='*.pyc' -cf - .) | gzip -n > /tmp/agentforge-rc2-clean.tar.gz
          echo "81a5efecdd1e9a7f23918ce444b9e4fe74a03f984192961f337b4fe6ea4ed6ce  /tmp/agentforge-rc2-clean.tar.gz" | sha256sum -c -

      - name: Upload RC2 reproducibility diagnostic
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stage31-rc2-repro-diagnostic
          path: /tmp/agentforge-rc2-clean.tar.gz
          if-no-files-found: warn
          retention-days: 2
      - name: Commit exact RC2 acceptance payload
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f rc/rc2.part*.b64
          base64 -w0 /tmp/agentforge-rc2-clean.tar.gz > /tmp/rc2.b64
          split -b 20000 -d -a 3 /tmp/rc2.b64 /tmp/rc2.part
          i=0
          for part in /tmp/rc2.part*; do
            printf -v n '%03d' "$i"
            cp "$part" "rc/rc2.part${n}.b64"
            i=$((i + 1))
          done
          printf "%s\n\n%s  %s\n\n%s\n%s\n" "Stage 3.1 V1.0-RC2 acceptance payload" "81a5efecdd1e9a7f23918ce444b9e4fe74a03f984192961f337b4fe6ea4ed6ce" "agentforge-stage3.1-v1.0-rc2-clean.tar.gz" "RC2 is derived only from the first real acceptance Ruff failure." "No dependency change; reviewed uv.lock remains unchanged." > rc/RC2_SOURCE_SHA256
          git config user.name "agentforge-stage31-bot"
          git config user.email "agentforge-stage31-bot@users.noreply.github.com"
          git add rc/rc2.part*.b64 rc/RC2_SOURCE_SHA256
          git commit -m "fix(rc): promote Stage 3.1 V1.0-RC2 Ruff repair"
          git push origin HEAD:main
