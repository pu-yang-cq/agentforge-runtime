name: Stage 3.2-D1 UNKNOWN Boundary

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_D1

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Apply Stage 3.2-D1 implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/stage32_d1_patch.py

      - name: Canonically format Stage 3.2-D1 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-d1-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-d1-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff format src migrations tests"

      - name: Verify D1 semantic boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -R 'UNRESOLVED' -n src migrations tests
          grep -R 'record_side_effect_unknown' -n src tests
          grep -R 'ACTION_UNKNOWN' -n src tests
          grep -R 'SIDE_EFFECT_POSSIBLE_EXECUTION' -n src tests
          test -f migrations/versions/0011_side_effect_unknown.py
          test -f docs/implementation/stage3.2-c-accepted.md

      - name: Prove UNKNOWN stops new model reasoning
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/application/run_manager.py").read_text()
          tree = ast.parse(source)
          execute = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef) and node.name == "execute"
          )
          calls = []
          for node in ast.walk(execute):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  calls.append((node.lineno, node.func.attr))
          load_unknown = min(line for line, name in calls if name == "load_unknown_external_action")
          begin_model = min(line for line, name in calls if name == "begin_model_invocation")
          if not load_unknown < begin_model:
              raise SystemExit(
                  f"UNKNOWN guard must precede model invocation: {load_unknown}, {begin_model}"
              )
          print("UNKNOWN durable fact outranks new model reasoning: PASS")
          PY

      - name: Prove ambiguous exceptions do not enter READ retry machinery
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/application/run_manager.py").read_text()
          tree = ast.parse(source)
          helper = next(
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef)
              and node.name == "_execute_side_effect_action"
          )
          helper_source = ast.get_source_segment(source, helper) or ""
          if "record_read_transient_failure" in helper_source:
              raise SystemExit("side-effect UNKNOWN path must not use READ retry")
          if "record_side_effect_unknown" not in helper_source:
              raise SystemExit("side-effect helper lacks UNKNOWN persistence")
          print("No blind side-effect retry in D1: PASS")
          PY

      - name: Run Stage 3.2-D1 target gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh

      - name: Commit Stage 3.2-D1 only if green
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git rm scripts/stage32_d1_patch.py
          git add src migrations tests
          git diff --cached --check
          git commit -m "feat(runtime): add side-effect UNKNOWN result boundary"
          git push origin HEAD:main
