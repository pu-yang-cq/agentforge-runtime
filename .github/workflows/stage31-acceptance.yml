name: Stage 3.1 Acceptance

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Python 3.14 + PostgreSQL 18 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout acceptance envelope
        uses: actions/checkout@v7.0.1

      - name: Require reviewed lockfile
        shell: bash
        run: |
          test -f uv.lock || {
            echo "uv.lock is not committed. Run Stage 3.1 Lock Bootstrap, review its artifact, then commit uv.lock." >&2
            exit 2
          }

      - name: Reconstruct and verify RC1 source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/agentforge-rc1
          cat rc/rc1.part*.b64 | base64 -d > /tmp/agentforge-rc1.tar.gz
          echo "20a19cd990dbf121cecc308e446d322432ab41ad85d2255f57695e3f2cb5f05d  /tmp/agentforge-rc1.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agentforge-rc1.tar.gz -C /tmp/agentforge-rc1
          test ! -f /tmp/agentforge-rc1/uv.lock || {
            echo "RC1 payload unexpectedly contains uv.lock." >&2
            exit 2
          }
          cp uv.lock /tmp/agentforge-rc1/uv.lock

      - name: Run isolated Stage 3.1 target gate
        shell: bash
        run: |
          cd /tmp/agentforge-rc1
          ./scripts/validate_stage31_containerized.sh
