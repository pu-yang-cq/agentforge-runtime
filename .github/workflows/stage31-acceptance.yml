name: Stage 3.1 Acceptance

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE31_ACCEPTANCE

permissions:
  contents: read

jobs:
  acceptance:
    name: Python 3.14 + PostgreSQL 18 acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout acceptance envelope
        uses: actions/checkout@v7.0.1

      - name: Require reviewed lockfile
        shell: bash
        run: |
          test -f uv.lock || {
            echo "uv.lock is not committed. Run Stage 3.1 Lock Bootstrap, review its artifact, then commit uv.lock." >&2
            exit 2
          }

      - name: Reconstruct and verify RC3 source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/agentforge-rc3
          mkdir -p /tmp/agentforge-rc3
          cat rc/rc3.part*.b64 | base64 -d > /tmp/agentforge-rc3.tar.gz
          echo "f0fb353981cc27060f83c4aafa949f9dd4feb57a5b5263878ca1231e2ad582c4  /tmp/agentforge-rc3.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agentforge-rc3.tar.gz -C /tmp/agentforge-rc3
          test ! -f /tmp/agentforge-rc3/uv.lock || {
            echo "RC3 payload unexpectedly contains uv.lock." >&2
            exit 2
          }
          cp uv.lock /tmp/agentforge-rc3/uv.lock
          echo "ea589824df68c1412a9ba797f673cf4110e122540a06e02ffcf15bb3e4fa406a  /tmp/agentforge-rc3/uv.lock" | sha256sum -c -

      - name: Run isolated Stage 3.1 target gate
        shell: bash
        run: |
          cd /tmp/agentforge-rc3
          ./scripts/validate_stage31_containerized.sh
