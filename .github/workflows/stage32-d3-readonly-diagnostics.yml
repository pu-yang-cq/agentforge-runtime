name: Stage 3.2-D3 Readonly Diagnostics

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_D3_READONLY_DIAG

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: stage32-d3-debug

      - name: Lock and sync on readonly workspace
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_CACHE_DIR=/tmp/cache \
            -e PYTHONDONTWRITEBYTECODE=1 \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv lock --check && uv sync --locked --all-groups"

      - name: Import on readonly workspace
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_CACHE_DIR=/tmp/cache \
            -e PYTHONDONTWRITEBYTECODE=1 \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked python -c 'import agentforge; print(agentforge.__file__)'"

      - name: Ruff lint readonly
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_CACHE_DIR=/tmp/cache \
            -e RUFF_CACHE_DIR=/tmp/ruff-cache -e PYTHONDONTWRITEBYTECODE=1 \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff check src apps tests migrations"

      - name: Ruff format readonly
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_CACHE_DIR=/tmp/cache \
            -e RUFF_CACHE_DIR=/tmp/ruff-cache -e PYTHONDONTWRITEBYTECODE=1 \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff format --check src apps tests migrations"

      - name: Mypy readonly
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_CACHE_DIR=/tmp/cache \
            -e PYTHONDONTWRITEBYTECODE=1 \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked mypy --cache-dir /tmp/mypy-cache"
