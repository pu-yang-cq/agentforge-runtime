name: Stage 3.1 Ruff Repair Proposal

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_RUFF_REPAIR

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Reconstruct reviewed RC1
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/agentforge-rc1 /tmp/agentforge-baseline
          mkdir -p /tmp/agentforge-rc1
          cat rc/rc1.part*.b64 | base64 -d > /tmp/agentforge-rc1.tar.gz
          echo "20a19cd990dbf121cecc308e446d322432ab41ad85d2255f57695e3f2cb5f05d  /tmp/agentforge-rc1.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agentforge-rc1.tar.gz -C /tmp/agentforge-rc1
          cp uv.lock /tmp/agentforge-rc1/uv.lock
          cp -a /tmp/agentforge-rc1 /tmp/agentforge-baseline

      - name: Generate Ruff mechanical repair proposal
        shell: bash
        run: |
          docker run --rm             -v /tmp/agentforge-rc1:/workspace             -w /workspace             ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim             sh -lc '
              set -eu
              export UV_CACHE_DIR=/tmp/uv-cache
              uv sync --locked --all-groups
              uv run --locked ruff check --fix --unsafe-fixes . || true
              uv run --locked ruff format .
              uv run --locked ruff check . > ruff-remaining.txt 2>&1 || true
              rm -rf .venv .ruff_cache
            '

      - name: Produce diff
        shell: bash
        run: |
          diff -ruN             --exclude=uv.lock             --exclude=.venv             --exclude=ruff-remaining.txt             /tmp/agentforge-baseline /tmp/agentforge-rc1             > /tmp/ruff.patch || true
          cp /tmp/agentforge-rc1/ruff-remaining.txt /tmp/ruff-remaining.txt
          tar -czf /tmp/ruff-repaired-source.tar.gz             --exclude=uv.lock             --exclude=ruff-remaining.txt             -C /tmp/agentforge-rc1 .
          sha256sum /tmp/ruff-repaired-source.tar.gz > /tmp/ruff-repaired-source.sha256

      - name: Upload repair proposal
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stage31-ruff-repair-proposal
          path: |
            /tmp/ruff.patch
            /tmp/ruff-remaining.txt
            /tmp/ruff-repaired-source.tar.gz
            /tmp/ruff-repaired-source.sha256
          if-no-files-found: error
          retention-days: 7
