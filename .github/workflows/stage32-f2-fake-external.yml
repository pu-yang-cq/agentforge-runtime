name: Stage 3.2-F2 Fake External Ledger

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_F2

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Apply Stage 3.2-F2 test infrastructure
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/stage32_f2_patch.py

      - name: Canonically format F2 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-f2-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-f2-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff format src/agentforge/testing tests/unit/test_fake_external_system.py"

      - name: Verify frozen F2 observability surface
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -R 'class StatefulFakeExternalSystem' -n src/agentforge/testing
          grep -R 'external_resource_id' -n src/agentforge/testing/fake_external_system.py
          grep -R 'duplicate_request_count' -n tests/support/fake_external_system.py
          grep -R 'reconciliation_query_count' -n tests/support/fake_external_system.py
          grep -R 'COMMIT_RESPONSE_LOSS' -n src/agentforge/testing tests/unit
          grep -R 'DEFINITE_NO_EFFECT' -n src/agentforge/testing tests/unit
          grep -R 'AMBIGUOUS_TIMEOUT' -n src/agentforge/testing tests/unit
          grep -R 'CrashBarrierPoint' -n src/agentforge/testing tests/unit
          test -f docs/implementation/stage3.2-f1-checkpoint-overlay.md

      - name: Run focused F2 fake-provider tests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-f2-test-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-f2-test-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked pytest -q tests/unit/test_fake_external_system.py"

      - name: Run full Stage 3.2-F2 regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh

      - name: Commit Stage 3.2-F2 only if green
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git rm scripts/stage32_f2_patch.py
          git add src/agentforge/testing tests/unit/test_fake_external_system.py
          git diff --cached --check
          git commit -m "test(runtime): add stateful fake external ledger"
          git push origin HEAD:main
