name: Stage 3.2-F2 Acceptance

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_F2_ACCEPTANCE

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify committed F2 test infrastructure
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docs/implementation/stage3.2-f1-checkpoint-overlay.md
          test -f src/agentforge/testing/fake_external_system.py
          test -f tests/unit/test_fake_external_system.py
          test ! -f scripts/stage32_f2_patch.py
          grep -R 'class StatefulFakeExternalSystem' -n src/agentforge/testing
          grep -R 'external_resource_id' -n src/agentforge/testing/fake_external_system.py
          grep -R 'call_count' -n src/agentforge/testing/fake_external_system.py
          grep -R 'effect_count' -n src/agentforge/testing/fake_external_system.py
          grep -R 'duplicate_request_count' -n src/agentforge/testing/fake_external_system.py
          grep -R 'reconciliation_query_count' -n src/agentforge/testing/fake_external_system.py

      - name: Prove F2 does not enter production runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -R 'agentforge.testing' -n src/agentforge --exclude-dir=testing; then
            echo "production runtime imports F2 testing infrastructure" >&2
            exit 1
          fi
          echo "F2 remains test-only infrastructure: PASS"

      - name: Prove all frozen crash windows are declared
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python - <<'PY'
          from agentforge.testing.fake_external_system import CrashBarrierPoint

          expected = {
              "before_action_preparation_commit",
              "after_ready_commit",
              "before_action_commit",
              "after_action_commit_before_external_call",
              "during_external_call",
              "after_external_effect_before_response",
              "after_response_before_db_result_commit",
              "during_result_commit",
              "during_reconciliation_request",
              "after_reconciliation_response_before_result_commit",
              "during_durable_retry_yield",
              "during_cancellation_model_result_race",
          }
          actual = {point.value for point in CrashBarrierPoint}
          if actual != expected:
              raise SystemExit(f"crash window mismatch: missing={expected-actual}, extra={actual-expected}")
          print("all 12 frozen crash windows declared: PASS")
          PY

      - name: Prove duplicate-effect observability and secret isolation tests exist
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -R 'test_fake_external_idempotent_duplicate_does_not_duplicate_effect' -n tests/unit/test_fake_external_system.py
          grep -R 'test_fake_external_non_idempotent_duplicate_is_observable' -n tests/unit/test_fake_external_system.py
          grep -R 'test_fake_external_commit_response_loss_exposes_committed_effect' -n tests/unit/test_fake_external_system.py
          grep -R 'test_fake_external_reconciliation_is_read_only_and_counted' -n tests/unit/test_fake_external_system.py
          grep -R 'test_fake_external_ledger_never_stores_credential_reference_or_secret_material' -n tests/unit/test_fake_external_system.py

      - name: Run focused F2 acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-f2-accept-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-f2-accept-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked pytest -q tests/unit/test_fake_external_system.py"

      - name: Run independent F2 full regression
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh
