name: Stage 3.2-C1 Action Commit Boundary

"on":
  push:
    branches: [main]
    paths:
      - rc/RUN_STAGE32_C1

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Apply Stage 3.2-C1 implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/stage32_c1_patch.py

      - name: Canonically format Stage 3.2-C1 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/agentforge-c1-venv \
            -e UV_CACHE_DIR=/tmp/agentforge-c1-cache \
            ghcr.io/astral-sh/uv:0.12.20-python3.14-trixie-slim \
            sh -lc "uv sync --locked --all-groups >/dev/null && uv run --locked ruff format src migrations tests"

      - name: Verify C1 semantic boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -R 'record_side_effect_attempt_started' -n src tests
          grep -R 'ACTION_COMMITTED' -n src tests
          grep -R 'load_ready_external_action' -n src tests
          grep -R 'SideEffectInvocation' -n src tests
          test -f docs/implementation/stage3.2-b-accepted.md
          test ! -f migrations/versions/0011_action_commit.py

      - name: Prove adapter invocation is after Action Commit API call
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("src/agentforge/application/run_manager.py").read_text()
          tree = ast.parse(source)
          helper = next(
              node
              for node in ast.walk(tree)
              if isinstance(node, ast.AsyncFunctionDef)
              and node.name == "_execute_side_effect_action"
          )
          calls = []
          for node in ast.walk(helper):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                  calls.append((node.lineno, node.func.attr))
          start = min(line for line, name in calls if name == "record_side_effect_attempt_started")
          invoke = min(line for line, name in calls if name == "execute_side_effect")
          success = min(line for line, name in calls if name == "record_side_effect_succeeded")
          if not start < invoke < success:
              raise SystemExit(f"invalid Action Commit ordering: {start}, {invoke}, {success}")
          print("Action Commit call ordering: PASS")
          PY

      - name: Run Stage 3.2-C1 target gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate_stage31_containerized.sh

      - name: Commit Stage 3.2-C1 only if green
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "agentforge-stage32-bot"
          git config user.email "agentforge-stage32-bot@users.noreply.github.com"
          git rm scripts/stage32_c1_patch.py
          git add src tests
          git diff --cached --check
          git commit -m "feat(runtime): add fenced side-effect Action Commit boundary"
          git push origin HEAD:main
