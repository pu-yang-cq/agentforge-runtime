[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "agentforge"
version = "0.1.0"
description = "Production-grade agent runtime and governance platform"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.142,<0.143",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.20,<1.21",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "testcontainers[postgres]>=4,<5",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src/agentforge", "apps"]
